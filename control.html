<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Auction Control Panel</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#101014;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100%}
body{padding:28px}.wrap{max-width:760px;margin:auto}.card{background:#19191f;border:1px solid #303039;border-radius:18px;padding:22px;box-shadow:0 20px 60px #0007}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.title h1{margin:0;font-size:22px}.badge{font-size:10px;font-weight:800;padding:7px 9px;border-radius:999px;background:#25252d;color:#aaa}.section{border-top:1px solid #303039;padding-top:18px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:10px}.field label{display:block;color:#999ca6;font-size:11px;font-weight:700;margin-bottom:6px}input{width:100%;height:40px;border:1px solid #35353e;border-radius:9px;background:#25252d;color:#fff;padding:0 11px;outline:none}input:focus{border-color:#25f4ee}button{height:40px;border:0;border-radius:9px;padding:0 13px;color:#fff;background:#303039;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.12)}.primary{background:linear-gradient(135deg,#fe2c55,#ff466c)}.cyan{background:linear-gradient(135deg,#16aaa7,#25f4ee);color:#081010}.danger{background:#54212a}.full{width:100%}.status{padding:12px;border-radius:10px;background:#111116;color:#9da0aa;font-size:12px;line-height:1.5}.status b{color:#fff}.status.ok{border:1px solid #1c9b5d}.status.bad{border:1px solid #8f3041}.timer{font-size:42px;font-weight:900;text-align:center;margin:10px 0}.state{text-align:center;color:#9da0aa;font-size:12px}.login{position:fixed;inset:0;background:#101014;display:grid;place-items:center;padding:20px}.login .card{width:min(420px,100%)}.hidden{display:none}.small{font-size:11px;color:#777b86;line-height:1.5;margin-top:8px}.toast{position:fixed;right:20px;bottom:20px;background:#25252d;padding:12px 15px;border-radius:10px;display:none}.toast.show{display:block}
</style>
</head><body>
<div id="login" class="login"><div class="card"><h2 style="margin-top:0">Auction Control</h2><p style="color:#999ca6;font-size:13px">Enter the control key you set in Netlify.</p><input id="key" type="password" placeholder="Control key"><button class="primary full" id="loginBtn" style="margin-top:10px">Open Control Panel</button></div></div>
<div class="wrap hidden" id="app"><div class="card">
<div class="title"><h1>TikTok LIVE Auction</h1><span class="badge" id="statusBadge">OFFLINE</span></div>
<div class="timer" id="timer">00:00</div><div class="state" id="stateText">Connecting...</div>
<div class="section"><div class="grid"><div class="field"><label>Top Text</label><input id="topText" placeholder="Example: Gift to enter!"></div><div class="field"><label>Main Auction Time (seconds)</label><input id="auctionTime" type="number" min="1" value="60"></div><div class="field"><label>Stream Delay (seconds)</label><input id="streamDelay" type="number" min="0" value="20"></div></div><div class="grid"><button class="primary" id="apply">Apply + Restart</button><button id="resetTimer">Restart Timer</button></div><button class="danger full" id="resetAuction" style="margin-top:10px">Reset Auction + Clear Bids</button></div>
<div class="section"><h3 style="margin:0 0 12px">Gift Simulator</h3><div class="grid"><div class="field"><label>Username</label><input id="simUser" value="TestUser"></div><div class="field"><label>Gift</label><input id="simGift" value="Rose"></div><div class="field"><label>Coins / Gift</label><input id="simCoins" type="number" value="1" min="0"></div><div class="field"><label>Quantity</label><input id="simQty" type="number" value="1" min="1"></div></div><button class="cyan full" id="sendGift">Send Simulated Gift</button><div class="grid" style="margin-top:10px"><button data-preset="Rose|1">🌹 Rose · 1</button><button data-preset="TikTok|1">🎵 TikTok · 1</button><button data-preset="Galaxy|1000">🌌 Galaxy · 1000</button><button data-preset="Lion|29999">🦁 Lion · 29999</button></div></div>
<div class="section"><div class="status" id="connection">Connecting to auction server...</div><div class="small">The LIVE Studio widget is display-only. Use this page to change settings or restart the auction.</div></div>
</div></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);let key='';let state=null;let offset=0;
function showToast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),1800)}
async function api(command,data={}){const r=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json','X-Control-Key':key},body:JSON.stringify({command,...data})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j.state}
function format(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function render(){if(!state)return;const now=Date.now()-offset;let left=0;if(state.status==='auction')left=(state.auctionEndsAt-now)/1000;else if(state.status==='delay')left=(state.delayEndsAt-now)/1000;$('timer').textContent=format(left);$('stateText').textContent=state.status==='auction'?'MAIN AUCTION RUNNING':state.status==='delay'?'STREAM DELAY RUNNING':'AUCTION ENDED';$('statusBadge').textContent=state.status.toUpperCase();$('topText').value=state.settings.topText;$('auctionTime').value=state.settings.auctionTime;$('streamDelay').value=state.settings.streamDelay}
async function poll(){try{const r=await fetch('/api/state?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();state=await r.json();offset=Date.now()-Number(state.serverNow||Date.now());render();$('connection').textContent='Auction server connected.';$('connection').className='status ok'}catch(e){$('connection').textContent='Could not reach auction server.';$('connection').className='status bad'}}
$('loginBtn').onclick=()=>{const v=$('key').value.trim();if(!v)return;$('login').classList.add('hidden');$('app').classList.remove('hidden');key=v;localStorage.setItem('auctionControlKey',v);poll()};
const saved=localStorage.getItem('auctionControlKey');if(saved){$('key').value=saved;$('login').classList.add('hidden');$('app').classList.remove('hidden');key=saved;poll()}
$('apply').onclick=async()=>{try{state=await api('applySettings',{topText:$('topText').value,auctionTime:Number($('auctionTime').value),streamDelay:Number($('streamDelay').value)});offset=Date.now()-Number(state.serverNow||Date.now());render();showToast('Settings applied and auction restarted')}catch(e){showToast(e.message)}};
$('resetTimer').onclick=async()=>{try{state=await api('resetTimer');offset=Date.now()-Number(state.serverNow||Date.now());render();showToast('Timer restarted')}catch(e){showToast(e.message)}};
$('resetAuction').onclick=async()=>{try{state=await api('resetAuction');offset=Date.now()-Number(state.serverNow||Date.now());render();showToast('Auction reset')}catch(e){showToast(e.message)}};
$('sendGift').onclick=async()=>{try{state=await api('gift',{data:{giftName:$('simGift').value,diamondCount:Number($('simCoins').value),repeatCount:Number($('simQty').value),transactionId:'sim-'+Date.now(),user:{uniqueId:$('simUser').value}}});showToast('Gift sent')}catch(e){showToast(e.message)}};
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const [g,c]=b.dataset.preset.split('|');$('simGift').value=g;$('simCoins').value=c;$('simQty').value=1});
setInterval(()=>{poll();},1000);setInterval(render,100);
</script></body></html>
