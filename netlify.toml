[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/state"
  to = "/.netlify/functions/state"
  status = 200

[[redirects]]
  from = "/api/control"
  to = "/.netlify/functions/control"
  status = 200

[[redirects]]
  from = "/api/event"
  to = "/.netlify/functions/event"
  status = 200
